name: Build and deploy Next.js to Azure Web App - frontend-doco

on:
  push:
    branches:
      - main
    paths:
      - "src/app/**"
      - ".github/workflows/main_frontend-doco.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: src/app/package-lock.json

      - name: Install dependencies
        working-directory: ./src/app
        run: npm ci

      - name: Build Next.js
        working-directory: ./src/app
        run: npm run build

      - name: Prepare standalone package
        run: |
          cp -r src/app/.next/static src/app/.next/standalone/.next/static
          cp -r src/app/public src/app/.next/standalone/public
          echo '{"scripts":{"start":"node server.js"}}' > src/app/.next/standalone/package.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: src/app/.next/standalone
      
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
        
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'frontend-doco'
          slot-name: 'Production'
          package: .
          publish-profile: ${{  secrets.AZUREAPPSERVICE_PUBLISHPROFILE_603B0301DCBC48CB9000282FE72DCD53}}