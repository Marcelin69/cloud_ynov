name: Build and deploy Next.js to Azure Web App - frontend-doco

on:
  push:
    branches:
      - main
    paths:
      - "src/app/**"
      - ".github/workflows/main_frontend-doco.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: src/app/package-lock.json

      - name: Install dependencies
        working-directory: ./src/app
        run: npm ci

      - name: Build Next.js
        working-directory: ./src/app
        run: npm run build

      - name: Prepare deployment folder
        working-directory: ./src/app
        run: |
          mkdir -p build
          cp -r .next/standalone/. build/
          mkdir -p build/.next/static
          cp -r .next/static/. build/.next/static/
          cp -r public/. build/public/ 2>/dev/null || true
          cp .next/BUILD_ID build/.next/BUILD_ID
          for f in build-manifest.json routes-manifest.json app-build-manifest.json react-loadable-manifest.json; do
            [ -f ".next/$f" ] && cp ".next/$f" "build/.next/$f" || true
          done
          echo "=== build/ ===" && ls build/
          echo "=== build/.next/ ===" && ls build/.next/

      # ✅ Upload folder (plus zip fragile)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: src/app/build
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'frontend-doco'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_603B0301DCBC48CB9000282FE72DCD53 }}