name: Build and deploy Next.js to Azure Web App - frontend-doco

on:
  push:
    branches:
      - main
    paths:
      - "src/app/**"
      - ".github/workflows/main_frontend-doco.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: src/app/package-lock.json

      - name: Install dependencies
        working-directory: ./src/app
        run: npm ci

      - name: Build Next.js
        working-directory: ./src/app
        run: npm run build

      - name: Prepare deployment package
        working-directory: ./src/app
        run: |
          mkdir -p deploy
          cp -r .next/standalone/. deploy/
          mkdir -p deploy/.next/static
          cp -r .next/static/. deploy/.next/static/
          [ -d public ] && cp -r public/. deploy/public/
          cp .next/BUILD_ID deploy/.next/BUILD_ID
          for f in build-manifest.json routes-manifest.json app-build-manifest.json react-loadable-manifest.json server-reference-manifest.json; do
            [ -f ".next/$f" ] && cp ".next/$f" "deploy/.next/$f" || true
          done
          echo "=== deploy/ ===" && ls deploy/
          echo "=== deploy/.next/ ===" && ls deploy/.next/

      - name: Zip deployment package
        working-directory: ./src/app
        run: cd deploy && zip -r ../deploy.zip . -x "*.git*"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'frontend-doco'
          slot-name: 'Production'
          package: ./src/app/deploy.zip
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_603B0301DCBC48CB9000282FE72DCD53 }}
