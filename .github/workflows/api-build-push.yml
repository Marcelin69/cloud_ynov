name: API Build and Push 

on:
    push:
        branches:
          - main
        paths:
          - "src/api/**"
          - ".github/workflows/api-build-push.yml"
    workflow_dispatch:
    
env:
  IMAGE_NAME: fastapi-tp1

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Log in to Azure Container Registry
              uses: azure/docker-login@v1
              with:
                  login-server: ${{ secrets.ACR_LOGIN_SERVER }}
                  username: ${{ secrets.ACR_USERNAME }}
                  password: ${{ secrets.ACR_PASSWORD }}

           
            - name: Build and push Docker image
              uses: docker/build-push-action@v6
              with:
                context: ./src/api
                file: ./src/api/Dockerfile
                push: true
                tags: |
                   ${{ secrets.ACR_LOGIN_SERVER }}/samples/${{ env.IMAGE_NAME }}:latest
                   ${{ secrets.ACR_LOGIN_SERVER }}/samples/${{ env.IMAGE_NAME }}:${{ github.sha }}
            - name: Azure Login
              uses: azure/login@v1
              with:
                creds: ${{ secrets.AZURE_CREDENTIALS }}
              
            - name: Configure container
              run: |
                az webapp config container set \
                  --name apiJob \
                  --resource-group dov-dynamic \
                  --docker-custom-image-name ${{ secrets.ACR_LOGIN_SERVER }}/samples/${{ env.IMAGE_NAME }}:${{ github.sha }} \
                  --docker-registry-server-url https://${{ secrets.ACR_LOGIN_SERVER }}
              
            - name: Restart App Service
              run: |
                az webapp restart \
                  --name apiJob \
                  --resource-group dov-dynamic
            - name: Debug image
              run: echo "Deploying image ${{ secrets.ACR_LOGIN_SERVER }}/samples/${{ env.IMAGE_NAME }}:${{ github.sha }}"