name: API Build and Push 

on:
    push:
        branches:
          - main
        paths:
          - "src/api/**"
          - ".github/workflows/api-build-push.yml"
    workflow_dispatch:
    
env:
  IMAGE_NAME: fastapi-tp1

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Log in to Azure Container Registry
              uses: azure/docker-login@v1
              with:
                  login-server: ${{ secrets.ACR_LOGIN_SERVER }}
                  username: ${{ secrets.ACR_USERNAME }}
                  password: ${{ secrets.ACR_PASSWORD }}

           
            - name: Build and push Docker image
              uses: docker/build-push-action@v6
              with:
                context: ./src/api
                file: ./src/api/Dockerfile
                push: true
                tags: |
                  ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}
                  ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            - name: Deploy to Azure Container Apps
              uses: azure/webapps-deploy@v2
              with:
                app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
                images: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
                publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLICH_PROFILE }}



